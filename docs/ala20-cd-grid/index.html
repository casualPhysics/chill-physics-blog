<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Shared plots</title>
<style>
  :root { --bg: #fbf7ef; --ink: #1f1d1a; --muted: #6a6356; --rule: #d8cfbf; --panel: #fffdf8; --accent: #a35a1f;
          --original: #8a8478; --old: #b23a2e; --new: #1f5f9e; --expt: #3d7a3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 17px; line-height: 1.55; }
  a { color: #6b3a14; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 24px 16px 60px; }
  #gate { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
  #gate h1 { font-size: 22px; font-weight: normal; margin-bottom: 18px; }
  #gate input { font: inherit; padding: 8px 10px; width: 100%; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); }
  #gate button, .controls button { font: inherit; font-size: 15px; padding: 6px 14px; margin-top: 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; }
  #gate button:hover, .controls button:hover { border-color: var(--accent); color: var(--accent); }
  #gate .err { color: var(--old); min-height: 1.5em; font-size: 15px; margin-top: 8px; }
  #app { display: none; }
  h1 { font-size: 26px; font-weight: normal; margin: 0 0 8px; line-height: 1.25; }
  .lede { margin: 0 0 8px; max-width: 900px; }
  .key { list-style: none; padding: 0; margin: 0 0 8px; font-size: 15px; max-width: 900px; }
  .key li { margin: 2px 0; }
  .sw { display: inline-block; width: 22px; height: 3px; vertical-align: middle; margin-right: 8px; }
  .note { font-size: 14px; color: var(--muted); max-width: 900px; margin: 0 0 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 15px; margin: 6px 0 12px; }
  .controls label { cursor: pointer; }
  .scroller { overflow-x: auto; padding-bottom: 8px; border-top: 1px solid var(--rule); padding-top: 10px; }
  table.lattice { border-collapse: separate; border-spacing: 4px; }
  table.lattice th { font-weight: normal; font-size: 12px; color: var(--muted); padding: 0 2px; white-space: nowrap; }
  table.lattice th.psi { text-align: right; }
  table.lattice td { padding: 0; }
  .cell { width: 118px; height: 84px; background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; cursor: zoom-in; position: relative; }
  .cell:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .cell .lab { position: absolute; top: 1px; left: 4px; font-size: 11px; color: var(--ink); background: rgba(255,253,248,0.8); padding: 0 2px; line-height: 1.3; }
  .cell .cv { position: absolute; top: 1px; right: 4px; font-size: 11px; font-weight: bold; background: rgba(255,253,248,0.8); padding: 0 2px; line-height: 1.3; }
  .cplkey { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .cplkey .bar { width: 120px; height: 10px; border: 1px solid var(--rule); background: linear-gradient(90deg, #3b6fb0, #fffdf8, #c0392b); }
  #controls-sel, .controls select { font: inherit; font-size: 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
  .cell .rng { position: absolute; bottom: 0; right: 4px; font-size: 9.5px; color: var(--muted); }
  .cell.none { cursor: default; background: transparent; border-style: dashed; }
  .cell.none .lab { color: var(--muted); }
  .cell svg { display: block; }
  .axis-title { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(31, 29, 26, 0.45); z-index: 10; align-items: center; justify-content: center; padding: 16px; }
  #modal.open { display: flex; }
  .sheet { background: var(--bg); border-radius: 6px; width: min(900px, 100%); max-height: 100%; overflow-y: auto; padding: 14px 18px 16px; box-shadow: 0 6px 30px rgba(0,0,0,0.25); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sheet-head h2 { font-size: 20px; font-weight: normal; margin: 0; }
  .sheet-head .nav button { font: inherit; font-size: 15px; border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; padding: 2px 9px; cursor: pointer; color: var(--ink); }
  .sheet-head .nav button:hover { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
  #zoomplot { width: 100%; height: 430px; }
  table.cpl { border-collapse: collapse; font-size: 15px; width: 100%; margin-top: 6px; }
  table.cpl th, table.cpl td { border-bottom: 1px solid var(--rule); padding: 3px 8px; text-align: right; }
  table.cpl th:first-child { text-align: left; font-weight: normal; }
  table.cpl td.muted { color: var(--muted); }
</style>
</head>
<body>
<div id="gate">
  <h1>Password</h1>
  <form id="gateform" autocomplete="off">
    <input id="pw" type="password" autofocus aria-label="password">
    <button type="submit">Open</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="wrap">
  <div id="intro"></div>
  <div class="controls">
    <label><input type="checkbox" data-series="original" checked> original</label>
    <label><input type="checkbox" data-series="old" checked> old couplings</label>
    <label><input type="checkbox" data-series="new" checked> new couplings</label>
    <label><input type="checkbox" id="expt"> PPII experiment lines</label>
    <label><input type="checkbox" id="shared"> same y-scale for all panels</label>
    <label>show coupling: <select id="cpl"><option value="">none</option></select></label>
    <span id="cplkey" class="cplkey"></span>
  </div>
  <p class="axis-title">rows: ψ (deg, nearest 15°; exact φ/ψ in each panel) &nbsp;·&nbsp; columns: φ (deg) &nbsp;·&nbsp; each panel 170–250 nm; corner label = y-range in 10³ (DichroCalc units)</p>
  <div class="scroller"><table class="lattice" id="lattice"></table></div>
</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="ztitle"></h2>
      <div class="nav"><button data-d="-1,0" title="φ − 15">←</button><button data-d="0,1" title="ψ up">↑</button><button data-d="0,-1" title="ψ down">↓</button><button data-d="1,0" title="φ + 15">→</button> <button id="zclose" title="close (Esc)">✕</button></div>
    </div>
    <p class="hint">Arrow keys step to the neighbouring geometry; Esc closes.</p>
    <div id="zoomplot"></div>
    <div id="ztable"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

const ITER = 310000;
const SERIES = ['original', 'old', 'new'];
const COL = { original: '#8a8478', old: '#b23a2e', new: '#1f5f9e', expt: '#3d7a3d' };
const NAMES = ['n₁n₂', 'n₁π₂', 'π₁n₂', 'π₁π₂'];
const EXPT = [[198, 'expt PPII − (198 nm)', 'dash'], [216.5, 'expt PPII + (215–218 nm)', 'dot']];
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const raw = b64(PAYLOAD), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct)));
}

let D, byKey = {}, byCell = {}, PHIS, PSIS, current = null;
const bin = s => 15 * Math.round(s / 15);   // put the offset sub-grid (psi = 175, 160, ...) on the nearest 15-degree row
const show = { original: true, old: true, new: true }, opts = { expt: false, shared: false, cpl: '' };
function cplVal(p) { if (!opts.cpl) return null; const [w, i] = opts.cpl.split(':'); return p[w] ? p[w][+i] : null; }
function cplLim() { const [w, i] = opts.cpl.split(':'); const a = D.points.map(p => Math.abs(p.new[+i])).sort((x, y) => x - y); return Math.max(50, a[Math.floor(0.95 * (a.length - 1))]); }
function tint(v, lim) { const t = Math.max(-1, Math.min(1, v / lim)), a = Math.abs(t) * 0.55; const c = t > 0 ? [192, 57, 43] : [59, 111, 176];
  return `rgb(${Math.round(255 + (c[0] - 255) * a)},${Math.round(253 + (c[1] - 253) * a)},${Math.round(248 + (c[2] - 248) * a)})`; }

function win(y) { const out = []; D.wl.forEach((w, i) => { if (w >= 170 && w <= 250) out.push([w, y[i]]); }); return out; }

function panelSVG(p, W, H, globalMax) {
  const series = SERIES.filter(s => show[s] && p.cd[s]);
  let m = 0; series.forEach(s => win(p.cd[s]).forEach(([, y]) => m = Math.max(m, Math.abs(y))));
  if (opts.shared) m = globalMax;
  m = m || 1;
  const X = w => (w - 170) / 80 * W, Y = y => H / 2 - y / m * (H / 2 - 6);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  svg += `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="#bdb4a3" stroke-width="0.6"/>`;
  if (opts.expt) EXPT.forEach(([x, , d]) => svg += `<line x1="${X(x)}" x2="${X(x)}" y1="0" y2="${H}" stroke="${COL.expt}" stroke-width="0.8" stroke-dasharray="${d === 'dash' ? '3,2' : '1,2'}"/>`);
  series.forEach(s => {
    const pts = win(p.cd[s]).map(([w, y]) => `${X(w).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${COL[s]}" stroke-width="${s === 'new' ? 1.8 : 1.1}" stroke-linejoin="round"/>`;
  });
  return { svg: svg + '</svg>', m };
}

function drawLattice() {
  let globalMax = 0;
  D.points.forEach(p => SERIES.forEach(s => { if (show[s] && p.cd[s]) win(p.cd[s]).forEach(([, y]) => globalMax = Math.max(globalMax, Math.abs(y))); }));
  const lim = opts.cpl ? cplLim() : 1;
  document.getElementById('cplkey').innerHTML = opts.cpl ? `<span>−${lim.toFixed(0)}</span><span class="bar"></span><span>+${lim.toFixed(0)} cm⁻¹</span>` : '';
  let h = '<tr><th></th>' + PHIS.map(f => `<th>φ ${f}</th>`).join('') + '</tr>';
  PSIS.forEach(s => {
    h += `<tr><th class="psi">ψ ≈ ${s}</th>`;
    PHIS.forEach(f => {
      const p = byCell[f + '/' + s];
      if (!p) { h += '<td></td>'; return; }
      if (!Object.keys(p.cd).length) { h += `<td><div class="cell none" title="DichroCalc gives no spectrum"><span class="lab">${p.phi}/${p.psi}</span><span class="rng">no spectrum</span></div></td>`; return; }
      const { svg, m } = panelSVG(p, 116, 82, globalMax), cv = cplVal(p);
      const bg = opts.cpl ? (cv === null ? ' style="background:#ece7dc"' : ` style="background:${tint(cv, lim)}"`) : '';
      const cvs = opts.cpl ? `<span class="cv">${cv === null ? 'n/a' : cv.toFixed(0)}</span>` : '';
      h += `<td><div class="cell"${bg} data-k="${p.phi}/${p.psi}"><span class="lab">${p.phi}/${p.psi}</span>${cvs}${svg}<span class="rng">±${m.toFixed(0)}k</span></div></td>`;
    });
    h += '</tr>';
  });
  const t = document.getElementById('lattice'); t.innerHTML = h;
  t.querySelectorAll('.cell[data-k]').forEach(c => c.onclick = () => openZoom(c.dataset.k));
}

function openZoom(k) {
  current = k; const p = byKey[k];
  document.getElementById('modal').classList.add('open');
  document.getElementById('ztitle').textContent = `Ala20 CD at φ/ψ = ${p.phi}/${p.psi}`;
  const tr = [];
  [['original', 'original DichroCalc', 1.8], ['old', 'old couplings', 1.8], ['new', 'new couplings', 3]].forEach(([s, lab, lw]) => {
    if (p.cd[s]) tr.push({ x: D.wl, y: p.cd[s], name: lab, type: 'scatter', mode: 'lines', line: { color: COL[s], width: lw }, visible: show[s] ? true : 'legendonly' });
  });
  const shapes = [{ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 0, y1: 0, line: { color: '#1f1d1a', width: 0.8 } }], ann = [];
  if (opts.expt) EXPT.forEach(([x, lab, d]) => {
    shapes.push({ type: 'line', x0: x, x1: x, yref: 'paper', y0: 0, y1: 1, line: { color: COL.expt, width: 1.5, dash: d } });
    ann.push({ x, yref: 'paper', y: 1, text: lab, showarrow: false, textangle: -90, xanchor: 'left', yanchor: 'top', font: { size: 11, color: COL.expt } });
  });
  const font = { family: '"Iowan Old Style", Palatino, Georgia, serif', size: 14, color: '#1f1d1a' };
  Plotly.react('zoomplot', tr, {
    paper_bgcolor: '#fbf7ef', plot_bgcolor: '#fbf7ef', font, margin: { l: 62, r: 16, t: 10, b: 80 }, shapes, annotations: ann,
    xaxis: { title: 'wavelength (nm)', range: [165, 260], gridcolor: '#d8cfbf' },
    yaxis: { title: 'CD (10³, DichroCalc units)', gridcolor: '#d8cfbf', zeroline: false },
    legend: { orientation: 'h', y: -0.25 },
  }, { displayModeBar: true, displaylogo: false, responsive: true, modeBarButtonsToRemove: ['lasso2d', 'select2d'] });
  const row = (lab, v, cls) => `<tr><th>${lab}</th>${v ? v.map(x => `<td class="${cls || ''}">${x.toFixed(0)}</td>`).join('') : '<td colspan="4" class="muted"><em>old pipeline failed at this geometry</em></td>'}</tr>`;
  document.getElementById('ztable').innerHTML = `<table class="cpl"><thead><tr><th>nearest-neighbour coupling (cm⁻¹)</th>${NAMES.map(n => `<th>${n}</th>`).join('')}</tr></thead><tbody>
    ${row('new', p.new)}${row('± jitter (3 % input noise)', p.jit, 'muted')}${row('old', p.old)}</tbody></table>`;
}

function step(df, ds) {
  if (!current) return;
  const [f, s0] = current.split('/').map(Number), s = bin(s0);
  const i = PHIS.indexOf(f), j = PSIS.indexOf(s), ok = k => byCell[k] && Object.keys(byCell[k].cd).length;
  if (df) { for (let a = i + df; a >= 0 && a < PHIS.length; a += df) { const k = PHIS[a] + '/' + s; if (ok(k)) return openZoom(byCell[k].phi + '/' + byCell[k].psi); } }
  if (ds) { for (let b = j - ds; b >= 0 && b < PSIS.length; b -= ds) { const k = f + '/' + PSIS[b]; if (ok(k)) return openZoom(byCell[k].phi + '/' + byCell[k].psi); } }
}
function closeZoom() { document.getElementById('modal').classList.remove('open'); current = null; }

function start(data) {
  D = data;
  D.points.forEach(p => { byKey[p.phi + '/' + p.psi] = p; byCell[p.phi + '/' + bin(p.psi)] = p; });
  PHIS = [...new Set(D.points.map(p => p.phi))].sort((a, b) => a - b);
  PSIS = [...new Set(D.points.map(p => bin(p.psi)))].sort((a, b) => b - a);
  document.getElementById('intro').innerHTML = D.intro; document.title = 'Ala20 CD across the Ramachandran grid';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.querySelectorAll('[data-series]').forEach(cb => cb.onchange = () => { show[cb.dataset.series] = cb.checked; drawLattice(); if (current) openZoom(current); });
  document.getElementById('expt').onchange = e => { opts.expt = e.target.checked; drawLattice(); if (current) openZoom(current); };
  document.getElementById('shared').onchange = e => { opts.shared = e.target.checked; drawLattice(); };
  const sel = document.getElementById('cpl');
  ['new', 'old'].forEach(w => [3, 0, 1, 2].forEach(i => { const o = document.createElement('option'); o.value = w + ':' + i; o.textContent = `${w} ${NAMES[i]} (cm⁻¹)`; sel.appendChild(o); }));
  sel.onchange = () => { opts.cpl = sel.value; drawLattice(); };
  document.getElementById('zclose').onclick = closeZoom;
  document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeZoom(); };
  document.querySelectorAll('.nav [data-d]').forEach(b => b.onclick = () => step(...b.dataset.d.split(',').map(Number)));
  document.addEventListener('keydown', e => {
    if (!current) return;
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
    if (m) { e.preventDefault(); step(...m); } else if (e.key === 'Escape') closeZoom();
  });
  drawLattice();
}

document.getElementById('gateform').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  err.textContent = 'Checking…';
  try {
    const data = await decrypt(pw);
    try { sessionStorage.setItem('cdgrid-pw', pw); } catch (_) {}
    start(data);
  } catch (_) { err.textContent = 'Wrong password.'; }
};
(async () => { let pw = null; try { pw = sessionStorage.getItem('cdgrid-pw'); } catch (_) {}
  if (pw) { try { start(await decrypt(pw)); } catch (_) {} } })();
</script>
</body>
</html>
